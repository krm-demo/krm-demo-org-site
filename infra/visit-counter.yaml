AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  krm-demo.org visit counter. CloudFront access logs go to a private bucket; an hourly function
  counts page openings and writes stats.json into the site bucket. See docs/visit-counter.md.
  Deploy in us-east-1 (CloudFront log delivery is configured there).

Parameters:
  DistributionId:
    Type: String
    Default: E3QPJMC44SZLZV
  SiteBucket:
    Type: String
    Default: krm-demo.org
  SiteBucketRegion:
    Type: String
    Default: us-west-2

Resources:
  # Private bucket for the access logs. Log files are deleted after 90 days.
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'krm-demo-org-cf-logs-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-access-logs
            Status: Enabled
            Prefix: AWSLogs/
            ExpirationInDays: 90

  # Lets the AWS log delivery service write into the bucket (and nothing else).
  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${LogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
                'aws:SourceAccount': !Ref AWS::AccountId
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:delivery-source:*'

  # CloudFront standard logging (v2): distribution -> bucket. Only the fields the counter needs are
  # delivered; in particular no IP address is stored.
  LogSource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: krm-demo-org-cloudfront
      ResourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
      LogType: ACCESS_LOGS
  LogDestination:
    Type: AWS::Logs::DeliveryDestination
    DependsOn: LogsBucketPolicy
    Properties:
      Name: krm-demo-org-cloudfront-s3
      DestinationResourceArn: !GetAtt LogsBucket.Arn
      OutputFormat: json
  LogDelivery:
    Type: AWS::Logs::Delivery
    Properties:
      DeliverySourceName: !Ref LogSource
      DeliveryDestinationArn: !GetAtt LogDestination.Arn
      RecordFields:
        - date
        - time
        - cs-method
        - cs-uri-stem
        - sc-status
        - cs(Referer)
        - cs(User-Agent)
        - x-edge-result-type
        - c-country

  CounterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-logs-write-stats
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt LogsBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${LogsBucket.Arn}/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub '${LogsBucket.Arn}/state/*'
                  - !Sub 'arn:aws:s3:::${SiteBucket}/stats.json'

  # Counts openings of pages ("/" and *.html, answered 200 or 304, not by a robot) and publishes the totals.
  # It keeps its running totals in state/visits.json in the logs bucket.
  Counter:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: krm-demo-org-visit-counter
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt CounterRole.Arn
      Environment:
        Variables:
          LOGS: !Ref LogsBucket
          SITE: !Ref SiteBucket
          SITE_REGION: !Ref SiteBucketRegion
      Code:
        ZipFile: |
          import boto3, gzip, json, os, datetime as dt
          LOGS, SITE, REGION = os.environ["LOGS"], os.environ["SITE"], os.environ["SITE_REGION"]
          STATE, FMT = "state/visits.json", "%Y-%m-%dT%H:%M:%S"
          BOTS = ("bot", "crawl", "spider", "slurp", "preview", "curl", "wget", "python", "monitor", "headless",
                  "facebookexternalhit", "whatsapp", "telegram", "slack", "discord", "scan")
          s3 = boto3.client("s3")

          def rows(body):
              names = None
              for line in gzip.decompress(body).decode("utf-8", "replace").splitlines():
                  if line.startswith("{"):
                      yield json.loads(line)
                  elif line.startswith("#Fields:"):
                      names = line.split()[1:]
                  elif names and not line.startswith("#"):
                      yield dict(zip(names, line.split(chr(9)) if chr(9) in line else line.split()))

          def handler(event, context):
              now = dt.datetime.now(dt.timezone.utc)
              try:
                  st = json.loads(s3.get_object(Bucket=LOGS, Key=STATE)["Body"].read())
              except s3.exceptions.NoSuchKey:
                  st = {"wm": "", "since": now.date().isoformat(), "days": {}, "total": {}}
              limit = (now - dt.timedelta(seconds=60)).strftime(FMT)
              wm = st["wm"]
              for page in s3.get_paginator("list_objects_v2").paginate(Bucket=LOGS, Prefix="AWSLogs/"):
                  for o in page.get("Contents", []):
                      lm = o["LastModified"].strftime(FMT)
                      if not (st["wm"] < lm <= limit):
                          continue
                      wm = max(wm, lm)
                      for r in rows(s3.get_object(Bucket=LOGS, Key=o["Key"])["Body"].read()):
                          path, ua = str(r.get("cs-uri-stem", "")), str(r.get("cs(User-Agent)", "")).lower()
                          if r.get("cs-method") != "GET" or str(r.get("sc-status")) not in ("200", "304"):
                              continue
                          if not (path == "/" or path.endswith(".html")) or path in ("/error.html", "/404.html"):
                              continue
                          if any(b in ua for b in BOTS):
                              continue
                          name = "index.html" if path == "/" else path.lstrip("/")
                          day = st["days"].setdefault(str(r.get("date")), {})
                          day[name] = day.get(name, 0) + 1
                          st["total"][name] = st["total"].get(name, 0) + 1
              st["wm"] = wm
              st["days"] = {d: st["days"][d] for d in sorted(st["days"])[-35:]}
              week = [(now.date() - dt.timedelta(days=i)).isoformat() for i in range(7)]
              pages = {n: {"week": sum(st["days"].get(d, {}).get(n, 0) for d in week), "total": t}
                       for n, t in st["total"].items()}
              out = {"updated": now.strftime(FMT) + "Z", "since": st["since"], "pages": pages}
              s3.put_object(Bucket=LOGS, Key=STATE, Body=json.dumps(st))
              boto3.client("s3", region_name=REGION).put_object(
                  Bucket=SITE, Key="stats.json", Body=json.dumps(out),
                  ContentType="application/json", CacheControl="public, max-age=300")
              return out

  Hourly:
    Type: AWS::Events::Rule
    Properties:
      Description: Run the krm-demo.org visit counter every hour
      ScheduleExpression: rate(1 hour)
      Targets:
        - Arn: !GetAtt Counter.Arn
          Id: visit-counter
  HourlyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Counter
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Hourly.Arn

Outputs:
  LogsBucketName:
    Value: !Ref LogsBucket
  CounterFunction:
    Value: !Ref Counter
