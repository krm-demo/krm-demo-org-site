<!DOCTYPE html>
<html lang="en">
<head>
    <title>krm-demo — page not found</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- This page is served for any missing address, at any depth, so it carries its own few styles
         instead of linking site.css by a relative path. -->
    <style>
        body { margin: 0; font: 1.0625rem/1.6 "Avenir Next", "Segoe UI", system-ui, sans-serif; background: #fbfcfe; color: #18212c; }
        header { background: #8a1c1c; color: #fff; padding: 0.7rem 1.25rem; font-size: 1.5rem; font-weight: 650; }
        main { max-width: 40rem; margin: 3rem auto; padding: 0 1.25rem; }
        a { color: #1456b8; text-decoration: none; }
        a:hover { color: #0a3476; }
        @media (prefers-color-scheme: dark) { body { background: #14181f; color: #dfe5ee; } a { color: #8fc1ff; } }
    </style>
</head>
<body>

<header>krm-demo</header>

<main>
    <h1>This page does not exist</h1>
    <p>The address may be mistyped, or the page may have moved. Start again from the <a href="/">home page</a>.</p>
</main>

</body>
</html>
