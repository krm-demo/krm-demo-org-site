name: Release to AWS S3 (krm-demo.org)

# Release to AWS S3. Runs ONLY for version tags (v1.0.0, v1.2, ...), never for plain pushes to main.
# Pushes to main go to the GitHub Pages preview instead (see pages.yml).
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # manual run: pick a v* tag in "Use workflow from" (the AWS role trusts tags only)

permissions:
  id-token: write   # lets the job get a short-lived AWS session via OIDC
  contents: read

concurrency:
  group: release-aws-s3
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  S3_BUCKET: krm-demo.org
  AWS_ROLE_ARN: arn:aws:iam::560574854768:role/krm-demo-org-site-deploy
  CLOUDFRONT_DISTRIBUTION_ID: E3QPJMC44SZLZV   # HTTPS in front of the bucket
  SITE_URL: https://krm-demo.org/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what is being released
        run: echo "Releasing ${GITHUB_REF_NAME} (${GITHUB_SHA::7}) to s3://${S3_BUCKET}"

      # Python and Node packages that turn docs/*.md into pages (see scripts/install-build-deps.sh).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: scripts/install-build-deps.sh

      # Same build as the GitHub Pages preview (see scripts/build.sh).
      - name: Build
        run: scripts/build.sh aws-s3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # stats.json (visit counts) is written into the bucket by the counter function, not by this build:
      # it is excluded so that --delete leaves it alone.
      # Pages may be cached for 5 minutes. build-site.json only for 10 seconds: open pages poll it
      # to notice a new version, so a stale copy in CloudFront would delay that by up to 5 minutes.
      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude build-site.json \
            --exclude stats.json \
            --cache-control "public, max-age=300"
          aws s3 cp dist/build-site.json "s3://${S3_BUCKET}/build-site.json" \
            --content-type application/json \
            --cache-control "public, max-age=10"

      # CloudFront keeps copies of the pages; drop them so the release is visible right away.
      - name: Invalidate CloudFront cache
        run: |
          id=$(aws cloudfront create-invalidation \
                 --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
                 --paths '/*' \
                 --query Invalidation.Id --output text)
          echo "Invalidation ${id} started; waiting for it to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --id "${id}"

      - name: Smoke test
        run: |
          curl -fsS "${SITE_URL}" -o /tmp/index.html
          cmp /tmp/index.html dist/index.html && echo "Live index.html matches the build."
          curl -fsS "${SITE_URL}build-site.json" | jq -e --arg sha "$GITHUB_SHA" '.sha == $sha' \
            && echo "Live build-site.json is this build."
