name: Release to AWS S3 (krm-demo.org)

# Release to AWS S3. Runs ONLY for version tags (v1.0.0, v1.2, ...), never for plain pushes to main.
# Pushes to main go to the GitHub Pages preview instead (see pages.yml).
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # manual run: pick a v* tag in "Use workflow from" (the AWS role trusts tags only)

permissions:
  id-token: write   # lets the job get a short-lived AWS session via OIDC
  contents: read

concurrency:
  group: release-aws-s3
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  S3_BUCKET: krm-demo.org
  AWS_ROLE_ARN: arn:aws:iam::560574854768:role/krm-demo-org-site-deploy
  SITE_URL: http://krm-demo.org/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what is being released
        run: echo "Releasing ${GITHUB_REF_NAME} (${GITHUB_SHA::7}) to s3://${S3_BUCKET}"

      # Build: for now the site is plain HTML in site/, copied as-is to dist/.
      # Keep this step identical to the Build step in pages.yml.
      - name: Build
        run: |
          rm -rf dist
          cp -R site dist
          ls -la dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=300"

      - name: Smoke test
        run: |
          curl -fsS "${SITE_URL}" -o /tmp/index.html
          cmp /tmp/index.html dist/index.html && echo "Live index.html matches the build."
