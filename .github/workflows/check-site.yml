name: Check krm-demo.org (HTTPS via CloudFront)

# Checks the CloudFront setup directly (connecting to the distribution while asking for krm-demo.org),
# so it works independently of DNS. Run it from the Actions tab whenever something looks wrong.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-site.yml']

permissions:
  contents: read

env:
  CF_DOMAIN: d32q0v8m1f1zsx.cloudfront.net   # CloudFront distribution E3QPJMC44SZLZV
  SITE: krm-demo.org

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Where does krm-demo.org point (public DNS)
        run: |
          echo "krm-demo.org     -> $(dig +short krm-demo.org A | tr '\n' ' ')"
          echo "www.krm-demo.org -> $(dig +short www.krm-demo.org A | tr '\n' ' ')"
          echo "${CF_DOMAIN} -> $(dig +short ${CF_DOMAIN} A | tr '\n' ' ')"

      - name: Certificate served by CloudFront
        run: |
          for host in "$SITE" "www.$SITE"; do
            echo "== $host"
            echo | openssl s_client -connect "${CF_DOMAIN}:443" -servername "$host" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -enddate -ext subjectAltName
          done

      - name: Pages and redirects
        run: |
          set -u
          fail=0
          via() { echo "--connect-to $1:443:${CF_DOMAIN}:443 --connect-to $1:80:${CF_DOMAIN}:80"; }
          check() {  # name, expected status, url, [expected location prefix | expected body text]
            local name="$1" want="$2" url="$3" extra="${4:-}" host
            host=$(echo "$url" | sed -E 's#^https?://([^/]+).*#\1#')
            out=$(curl -sS -o /tmp/body $(via "$host") -w '%{http_code} %{redirect_url}' "$url")
            code=${out%% *}; loc=${out#* }
            ok=1
            [ "$code" = "$want" ] || ok=0
            if [ -n "$extra" ]; then
              if [ "${want:0:1}" = "3" ]; then [ "$loc" = "$extra" ] || ok=0
              else grep -q "$extra" /tmp/body || ok=0; fi
            fi
            if [ $ok = 1 ]; then echo "OK    $name: $code $loc"; else echo "FAIL  $name: got $code $loc (want $want $extra)"; fail=1; fi
          }
          check "home page"           200 "https://${SITE}/"               'id="build-info"'
          check "build.json"          200 "https://${SITE}/build.json"     '"sha"'
          check "error page"          404 "https://${SITE}/no-such-page"   'krm-demo (error)'
          check "http -> https"       301 "http://${SITE}/"                "https://${SITE}/"
          check "www -> apex"         301 "https://www.${SITE}/a?b=1"      "https://${SITE}/a?b=1"
          check "http www -> https"   301 "http://www.${SITE}/"            "https://www.${SITE}/"
          echo "--- build.json"; curl -sS $(via "$SITE") "https://${SITE}/build.json"; echo
          exit $fail
