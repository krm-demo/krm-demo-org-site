<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piecewise Continuous Graph — swept-amount-math (prototype)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--surface-2:#ffffff;--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.2);--border-stronger:rgba(0,0,0,.4);--font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;--font-voice:Georgia,"Times New Roman",serif;--font-mono:ui-monospace,Menlo,monospace;--radius:8px}
@media (prefers-color-scheme:dark){:root{--text-primary:#eceae4;--text-secondary:#b4b2a9;--text-muted:#888780;--surface-2:#262624;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.22);--border-stronger:rgba(255,255,255,.45)}body{background:#1a1a19}}
body{margin:0;font-family:var(--font-sans);color:var(--text-primary)}
main{max-width:420px;margin:0 auto;padding:16px}
button{font:inherit;background:transparent;color:var(--text-primary);border:0.5px solid var(--border-strong);border-radius:var(--radius);cursor:pointer}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin:4px 0 10px}
.ttl{font-family:var(--font-voice);font-size:21px;font-weight:500;line-height:1.2}
.sub{font-family:var(--font-voice);font-style:italic;font-size:14px;color:var(--text-secondary)}
.ro{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);margin:0 0 4px;min-height:26px}
.badge{font-size:12px;font-weight:500;padding:3px 9px;border-radius:var(--radius)}
.mono{font-family:var(--font-mono);color:var(--text-primary)}
.vi{font-family:var(--font-voice);font-style:italic;font-size:15px;color:var(--text-primary)}
#g{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#fx{font-size:13px;margin:6px 0 12px;text-align:center;overflow:hidden;white-space:nowrap}
#fx .katex-display{margin:0}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 6px 6px 10px;display:flex;align-items:center;gap:8px;background:var(--surface-2)}
.chip .nm{font-family:var(--font-voice);font-style:italic;font-size:17px;line-height:1.15;white-space:nowrap}
.chip .v{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)}
.chip .bt{margin-left:auto;display:flex;gap:4px}
.chip button{width:28px;height:28px;padding:0;touch-action:manipulation}
.sw{width:9px;height:9px;flex:none}
.hint{font-size:12px;color:var(--text-muted);margin:10px 0 0}
</style>
</head>
<body>
<main>
<div class="hd">
<div><div class="ttl">Cash sweep math</div><div class="sub">Swept amount per current balance</div></div>
<div style="display:flex;gap:6px;flex:none"><button id="tog" style="font-size:13px;padding:0 10px;height:32px">$</button><button id="rst" aria-label="Reset" style="width:32px;height:32px;padding:0">↺</button></div>
</div>
<div class="ro" id="ro"></div>
<svg id="g" viewBox="0 0 380 340" role="img" aria-label="Swept amount versus current balance"></svg>
<div id="fx"></div>
<div class="chips" id="chips"></div>
<p class="hint">Diamonds move τ, top grips move ν, side rails set σ in $5 steps. Drag anywhere else to probe a balance.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
const D0={tmin:40,tmax:60,nmin:10,nmax:15,imax:25,omax:30,p:85};
const S={...D0,sym:true};
const D={x0:-8,x1:104,y0:-18,y1:52},P={L:22,R:358,T:30,B:268},RL=9,RR=371,STEP=5,CMIN=5,CMAX=50;
const BL='#378ADD';
const C={in:{l:'#EF9F27',s:'#BA7517',t:'Swept in',o:.13},nmin:{l:BL,s:BL,t:'In nominal min',o:.06},range:{l:BL,s:BL,t:'In range',o:.15},nmax:{l:BL,s:BL,t:'In nominal max',o:.06},out:{l:'#1D9E75',s:'#1D9E75',t:'Swept out',o:.13},over:{l:'#E24B4A',s:'#E24B4A',t:'Overflow',o:.1}};
const GR='#888780',INK='var(--text-primary)';
const kx=(P.R-P.L)/(D.x1-D.x0),ky=(P.B-P.T)/(D.y1-D.y0);
const X=x=>P.L+(x-D.x0)*kx,Y=y=>P.B-(y-D.y0)*ky,iX=px=>D.x0+(px-P.L)/kx,iY=py=>D.y0+(P.B-py)/ky;
const cl=(v,a,b)=>Math.min(Math.max(v,a),b),up5=v=>Math.max(CMIN,Math.ceil(v/STEP)*STEP);
const svg=document.getElementById('g');
function tex(s){let o='',i=0,m,re=/([A-Za-zα-ω]+)_([a-z]+)/g,sh=false;while((m=re.exec(s))){const pre=s.slice(i,m.index);if(pre){o+=`<tspan dy="${sh?-4:0}">${pre}</tspan>`;sh=false}o+=`<tspan dy="${sh?-4:0}">${m[1]}</tspan><tspan dy="4" font-size="11" font-style="normal">${m[2]}</tspan>`;sh=true;i=re.lastIndex}const post=s.slice(i);if(post)o+=`<tspan dy="${sh?-4:0}">${post}</tspan>`;return o}
const money=v=>{const r=Math.round(v*10)/10;return(r<0?'−':'')+'$'+Math.abs(r).toLocaleString('en-US',{maximumFractionDigits:1})};
const est=s=>s.replace(/_/g,'').length*6.6+4;
function set(k,v){const s=S;
if(k==='imax'||k==='omax')v=Math.round(v/STEP)*STEP;else v=Math.round(v);
if(k==='tmin')s.tmin=cl(v,D.x0+s.nmin,s.tmax);
if(k==='tmax')s.tmax=cl(v,s.tmin,D.x1-s.nmax);
if(k==='nmin')s.nmin=cl(v,0,Math.min(s.tmin-D.x0,s.imax));
if(k==='nmax')s.nmax=cl(v,0,Math.min(D.x1-s.tmax,s.omax));
if(k==='imax')s.imax=cl(v,up5(s.nmin),CMAX);
if(k==='omax')s.omax=cl(v,up5(s.nmax),CMAX);
if(k==='p')s.p=cl(v,D.x0,D.x1);render()}
function f(x){const{tmin,tmax,nmin,nmax,imax,omax}=S;if(x<tmin-nmin)return['in',Math.min(tmin-x,imax)];if(x<tmin)return['nmin',0];if(x<=tmax)return['range',0];if(x<=tmax+nmax)return['nmax',0];return x-tmax>omax?['over',null]:['out',x-tmax]}
const ln=(a,b,c,d,col,w,dash,op)=>`<line x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}" stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''} stroke-opacity="${op||1}" stroke-linecap="round"/>`;
const LAB='font-family:var(--font-voice);font-style:italic;font-size:14px';
function render(){
const{tmin,tmax,nmin,nmax,imax,omax,p,sym}=S,xl=tmin-nmin,xr=tmax+nmax,xk=tmin-imax,xo=tmax+omax,xc=(tmin+tmax)/2,yc=(tmin-tmax)/2,y0=Y(0),ax=X(0),xoc=Math.min(xo,D.x1);
let h=`<defs><clipPath id="cpz"><rect x="${P.L}" y="${P.T}" width="${P.R-P.L}" height="${P.B-P.T}"/></clipPath><pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#E24B4A" stroke-width="1" stroke-opacity="0.35"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
const bands=[[D.x0,xl,'in'],[xl,tmin,'nmin'],[tmin,tmax,'range'],[tmax,xr,'nmax'],[xr,xoc,'out'],[xoc,D.x1,'over']];
bands.forEach(([a,b,z])=>{const w=X(b)-X(a);if(w<=0.5)return;h+=`<rect x="${X(a)}" y="${P.T}" width="${w}" height="${P.B-P.T}" fill="${C[z].l}" fill-opacity="${C[z].o}"/>`;if(z==='over')h+=`<rect x="${X(a)}" y="${P.T}" width="${w}" height="${P.B-P.T}" fill="url(#hz)"/>`});
const wy=(P.T+P.B)/2-20;
bands.forEach(([a,b,z])=>{const w=X(b)-X(a);if(w<17)return;const cx=(X(a)+X(b))/2;h+=`<text transform="rotate(-90 ${cx} ${wy})" x="${cx}" y="${wy+5}" text-anchor="middle" style="font-family:var(--font-sans);font-size:14px;font-weight:500;letter-spacing:1.5px;fill:${C[z].s};fill-opacity:${z==='nmin'||z==='nmax'?0.42:0.34}">${C[z].t}</text>`});
h+=`<g id="grid"></g><g id="aux"></g>`;
h+=`<line x1="${P.L}" y1="${y0}" x2="${P.R+6}" y2="${y0}" stroke="var(--border-stronger)" stroke-width="1" marker-end="url(#ah)"/>`;
h+=`<line x1="${ax}" y1="${P.B}" x2="${ax}" y2="${P.T-6}" stroke="var(--border-stronger)" stroke-width="1" marker-end="url(#ah)"/>`;
h+=`<text x="${ax+8}" y="${P.T-12}" style="font-family:var(--font-voice);font-style:italic;font-size:13px;fill:var(--text-secondary)">Swept amount, $</text>`;
h+=`<text x="${ax-5}" y="${y0+4}" text-anchor="end" style="${LAB};fill:var(--text-secondary)">0</text>`;
let xs=[{x:xl,s:'τ_min − ν_min',c:C.in.s,py:Y(nmin)},{x:tmin,s:'τ_min',c:INK,py:y0},{x:xc,s:'(τ_min + τ_max)/2',c:GR,py:Y(yc)},{x:tmax,s:'τ_max',c:INK,py:y0},{x:xr,s:'τ_max + ν_max',c:C.out.s,py:Y(nmax)}];
if(xk>D.x0+1)xs.push({x:xk,s:'τ_min − σ_in',c:C.in.s,py:Y(imax)});
if(xo<D.x1-1)xs.push({x:xo,s:'τ_max + σ_out',c:C.over.s,py:Y(omax)});
if(tmax-tmin<2)xs=xs.filter(o=>o.s[0]!=='(');
xs.sort((a,b)=>a.x-b.x);
const rows=[];xs.forEach(o=>{o.w=sym?est(o.s):money(o.x).length*7.4+4;o.cx=cl(X(o.x),o.w/2+2,378-o.w/2);let r=0;while(rows[r]!==undefined&&o.cx-o.w/2<rows[r]+9)r++;rows[r]=o.cx+o.w/2;o.r=r});
const rowY=r=>P.B+19+r*18,H=rowY(rows.length-1)+30;
svg.setAttribute('viewBox',`0 0 380 ${H}`);
let ys=[{y:nmin,s:'ν_min',c:C.in.s,px:X(xl)},{y:nmax,s:'ν_max',c:C.out.s,px:X(xr)},{y:imax,s:'σ_in',c:C.in.s,px:null},{y:omax,s:'σ_out',c:C.over.s,px:null}];
if(tmax-tmin>=2)ys.push({y:yc,s:'(τ_min − τ_max)/2',c:GR,px:X(xc)});
ys.forEach(o=>o.cy=Y(o.y));ys.sort((a,b)=>b.cy-a.cy);for(let i=1;i<ys.length;i++)if(ys[i-1].cy-ys[i].cy<16)ys[i].cy=ys[i-1].cy-16;
h+=`<g stroke="${GR}" stroke-width="0.6" stroke-dasharray="1.5 3" stroke-opacity="0.8" fill="none">`;
xs.forEach(o=>{h+=`<line x1="${X(o.x)}" y1="${o.py+5}" x2="${X(o.x)}" y2="${rowY(o.r)-13}"/>`});
ys.forEach(o=>{if(o.px!==null&&Math.abs(o.y)>0.01)h+=`<line x1="${o.px}" y1="${Y(o.y)}" x2="${ax}" y2="${Y(o.y)}"/>`});
h+=`</g>`;
h+=`<line x1="${RL}" y1="${Y(imax)}" x2="${X(xl)}" y2="${Y(imax)}" stroke="${C.in.s}" stroke-width="1" stroke-dasharray="1 3" stroke-linecap="round"/>`;
h+=`<line x1="${ax}" y1="${Y(omax)}" x2="${RR}" y2="${Y(omax)}" stroke="${C.over.s}" stroke-width="1" stroke-dasharray="1 3" stroke-linecap="round" stroke-opacity="0.9"/>`;
h+=`<g clip-path="url(#cpz)">`;
h+=ln(tmin,0,tmin-D.y0,D.y0,GR,1,'2 4')+ln(tmax+D.y0,D.y0,tmax,0,GR,1,'2 4');
h+=ln(xl,nmin,tmin,0,BL,1.4,'4 3',0.85)+ln(tmax,0,xr,nmax,BL,1.4,'4 3',0.85);
if(xk>D.x0)h+=ln(D.x0,tmin-D.x0,xk,imax,C.in.s,1.4,'4 3',0.6);
if(xo<D.x1)h+=ln(xo,omax,D.x1,D.x1-tmax,C.over.s,1.4,'4 3',0.75);
const [pz,py]=f(p);
h+=`<line x1="${X(p)}" y1="${P.T}" x2="${X(p)}" y2="${P.B}" stroke="${C[pz].s}" stroke-width="1" stroke-opacity="0.55"/>`;
if(xk>D.x0)h+=ln(D.x0,imax,xk,imax,C.in.s,2.75);
if(xl>D.x0){const a=Math.max(xk,D.x0);h+=ln(a,tmin-a,xl,nmin,C.in.s,2.75)}
h+=ln(xl,0,xr,0,BL,2.75);
if(xr<D.x1)h+=ln(xr,nmax,xoc,xoc-tmax,C.out.s,2.75);
h+=`</g>`;
ys.forEach(o=>{h+=`<line x1="${ax-3}" y1="${Y(o.y)}" x2="${ax+3}" y2="${Y(o.y)}" stroke="${o.c}" stroke-width="1.2"/>`});
if(tmax-tmin>=2)h+=`<circle cx="${X(xc)}" cy="${Y(yc)}" r="3" fill="${GR}"/>`;
if(xk>D.x0)h+=`<circle cx="${X(xk)}" cy="${Y(imax)}" r="4.5" fill="${C.in.s}"/>`;
if(xo<D.x1)h+=`<circle cx="${X(xo)}" cy="${Y(omax)}" r="5" fill="${C.out.s}"/>`;
h+=`<circle cx="${X(xl)}" cy="${y0}" r="5" fill="${BL}"/><circle cx="${X(xr)}" cy="${y0}" r="5" fill="${BL}"/>`;
h+=`<circle cx="${X(xl)}" cy="${Y(nmin)}" r="5" fill="var(--surface-2)" stroke="${C.in.s}" stroke-width="2"/>`;
h+=`<circle cx="${X(xr)}" cy="${Y(nmax)}" r="5" fill="var(--surface-2)" stroke="${C.out.s}" stroke-width="2"/>`;
if(py!==null)h+=`<circle cx="${X(p)}" cy="${Y(py)}" r="6.5" fill="none" stroke="${C[pz].s}" stroke-width="1.2"/><circle cx="${X(p)}" cy="${Y(py)}" r="3" fill="${C[pz].s}"/>`;
ys.forEach(o=>{h+=`<text x="${ax+7}" y="${o.cy-4}" style="${LAB};fill:${o.c}">${sym?tex(o.s):money(o.y)}</text>`});
xs.forEach(o=>{h+=`<text x="${o.cx}" y="${rowY(o.r)}" text-anchor="middle" style="${LAB};fill:${o.c}">${sym?tex(o.s):money(o.x)}</text>`});
h+=`<text x="${P.R}" y="${H-8}" text-anchor="end" style="font-family:var(--font-voice);font-style:italic;font-size:13px;fill:var(--text-secondary)">Current balance, $</text>`;
const rail=(xp,v,k,c,mn)=>{let r=`<line x1="${xp}" y1="${Y(CMAX)}" x2="${xp}" y2="${Y(CMIN)}" stroke="var(--border-strong)" stroke-width="2" stroke-linecap="round"/>`;for(let t=CMIN;t<=CMAX;t+=STEP)r+=`<circle cx="${xp}" cy="${Y(t)}" r="1.6" fill="${t<mn?'var(--border)':'var(--border-stronger)'}"/>`;r+=`<g data-h="${k}" style="cursor:ns-resize"><rect x="${xp-16}" y="${Y(v)-15}" width="32" height="30" fill="transparent"/><rect x="${xp-9}" y="${Y(v)-6}" width="18" height="12" rx="6" fill="${c}" stroke="var(--surface-2)" stroke-width="1.5"/><line x1="${xp-4}" y1="${Y(v)-2}" x2="${xp+4}" y2="${Y(v)-2}" stroke="#fff" stroke-width="1"/><line x1="${xp-4}" y1="${Y(v)+2}" x2="${xp+4}" y2="${Y(v)+2}" stroke="#fff" stroke-width="1"/></g>`;return r};
h+=rail(RL,imax,'imax',C.in.s,up5(nmin))+rail(RR,omax,'omax',C.over.s,up5(nmax));
const dia=(x,k)=>`<g data-h="${k}" style="cursor:ew-resize"><circle cx="${X(x)}" cy="${y0}" r="17" fill="transparent"/><path d="M${X(x)} ${y0-7}L${X(x)+7} ${y0}L${X(x)} ${y0+7}L${X(x)-7} ${y0}Z" fill="var(--text-primary)" stroke="var(--surface-2)" stroke-width="1.5"/></g>`;
const grip=(x,k,c)=>`<g data-h="${k}" style="cursor:ew-resize"><rect x="${X(x)-16}" y="${P.T-16}" width="32" height="34" fill="transparent"/><line x1="${X(x)}" y1="${P.T}" x2="${X(x)}" y2="${P.B}" stroke="${c}" stroke-width="1.6" stroke-dasharray="0 4.5" stroke-linecap="round" stroke-opacity="0.8"/><rect x="${X(x)-6}" y="${P.T-11}" width="12" height="22" rx="6" fill="${c}" stroke="var(--surface-2)" stroke-width="1.5"/><line x1="${X(x)-2}" y1="${P.T-4}" x2="${X(x)-2}" y2="${P.T+4}" stroke="#fff" stroke-width="1"/><line x1="${X(x)+2}" y1="${P.T-4}" x2="${X(x)+2}" y2="${P.T+4}" stroke="#fff" stroke-width="1"/></g>`;
h+=grip(xl,'nmin',C.in.s)+grip(xr,'nmax',C.out.s)+dia(tmin,'tmin')+dia(tmax,'tmax');
svg.innerHTML=h;
const zc=C[pz];
document.getElementById('ro').innerHTML=`<span class="badge" style="background:${zc.l}26;color:${zc.s}">${zc.t}</span><span class="vi">x</span><span class="mono">${money(p)}</span><span>→</span><span class="vi">y</span><span class="mono">${py===null?'not defined':money(py)}</span>`;
const mu='#888780',mid=['nmin','range','nmax'].includes(pz),col=z=>(z==='range'?mid:z===pz)?C[z].s:mu;
const L=`y(x)=\\begin{cases}\\textcolor{${col('in')}}{\\min\\!\\left(\\tau_{\\min}-x,\\;\\sigma_{\\mathrm{in}}\\right)} & \\textcolor{${col('in')}}{x<\\tau_{\\min}-\\nu_{\\min}}\\\\[3pt]\\textcolor{${col('out')}}{x-\\tau_{\\max}} & \\textcolor{${col('out')}}{\\tau_{\\max}+\\nu_{\\max}<x\\le\\tau_{\\max}+\\sigma_{\\mathrm{out}}}\\\\[3pt]\\textcolor{${col('over')}}{\\nexists} & \\textcolor{${col('over')}}{x>\\tau_{\\max}+\\sigma_{\\mathrm{out}}}\\\\[3pt]\\textcolor{${col('range')}}{0} & \\textcolor{${col('range')}}{\\text{otherwise}}\\end{cases}`;
const fx=document.getElementById('fx');fx.style.fontSize='13px';
if(window.katex){try{katex.render(L,fx,{displayMode:true,throwOnError:false})}catch(e){fx.textContent=''}let fs=13;while(fx.scrollWidth>fx.clientWidth+1&&fs>7.5){fs-=0.5;fx.style.fontSize=fs+'px'}}else fx.innerHTML='<span class="vi">y = min(τ<sub>min</sub> − x, σ<sub>in</sub>), x − τ<sub>max</sub>, ∄ or 0</span>';
document.querySelectorAll('[data-v]').forEach(el=>el.textContent=money(S[el.dataset.v]));
document.getElementById('tog').textContent=sym?'$':'τ'}
const chips=[['tmin','τ','min','var(--text-primary)','d'],['tmax','τ','max','var(--text-primary)','d'],['nmin','ν','min',C.in.s,'s'],['nmax','ν','max',C.out.s,'s'],['imax','σ','in',C.in.s,'b'],['omax','σ','out',C.over.s,'b']];
const shp={d:'transform:rotate(45deg)',s:'border-radius:3px',b:'height:4px;border-radius:2px;width:12px'};
document.getElementById('chips').innerHTML=chips.map(([k,a,b,c,s])=>`<div class="chip"><span class="sw" style="background:${c};${shp[s]}"></span><div><div class="nm">${a}<sub style="font-style:normal;font-size:11px">${b}</sub></div><div class="v" data-v="${k}"></div></div><div class="bt"><button data-k="${k}" data-d="-1" aria-label="Decrease ${a} ${b}">−</button><button data-k="${k}" data-d="1" aria-label="Increase ${a} ${b}">+</button></div></div>`).join('');
let rep,rep2;const stop=()=>{clearTimeout(rep);clearInterval(rep2)};
document.querySelectorAll('[data-k]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();const k=b.dataset.k,cap=k==='imax'||k==='omax',d=+b.dataset.d*(cap?STEP:1);set(k,S[k]+d);rep=setTimeout(()=>{rep2=setInterval(()=>set(k,S[k]+d),cap?160:70)},350)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop))});
let drag=null;const pt=svg.createSVGPoint();
function mv(e){pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse()),x=iX(q.x),y=iY(q.y);
if(drag==='tmin'||drag==='tmax'||drag==='p')set(drag,x);else if(drag==='nmin')set('nmin',S.tmin-x);else if(drag==='nmax')set('nmax',x-S.tmax);else if(drag==='imax'||drag==='omax')set(drag,y)}
svg.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-h]');drag=g?g.dataset.h:'p';svg.setPointerCapture(e.pointerId);mv(e)});
svg.addEventListener('pointermove',e=>{if(drag)mv(e)});
['pointerup','pointercancel'].forEach(ev=>svg.addEventListener(ev,()=>drag=null));
document.getElementById('tog').onclick=()=>{S.sym=!S.sym;render()};
document.getElementById('rst').onclick=()=>{Object.assign(S,D0);render()};
render();
</script>
</body>
</html>
